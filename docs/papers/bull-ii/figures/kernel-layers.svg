<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Linux namespace execution layers</title><desc id="desc">BULL restricts the workload through namespace views, access rules, read-only mounts and resource budgets. Linux enforces these restrictions using a shared trusted host kernel, not a new guest kernel.</desc><rect width="1200" height="480" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="40" y="43" font-size="17" fill="#176c64" letter-spacing="2">THE NAMESPACE BACKEND SHARES THE HOST KERNEL</text><rect x="40" y="77" width="1120" height="335" rx="10" fill="#edf2ed" stroke="#cad8d2"/><g fill="#fff" stroke="#cad8d2"><rect x="78" y="106" width="1044" height="64" rx="6"/><rect x="108" y="183" width="984" height="64" rx="6"/><rect x="138" y="260" width="924" height="64" rx="6"/></g><g fill="#18272c" font-size="22" font-weight="600"><text x="98" y="146">Untrusted process</text><text x="128" y="223">Restricted access</text><text x="158" y="300">Namespace views</text><text x="78" y="379">Trusted host Linux kernel</text></g><g fill="#52666b" font-size="18"><text x="448" y="146">Admitted /workspace · separate /bull_runtime</text><text x="448" y="223">seccomp · Landlock · no_new_privs · resource limits</text><text x="448" y="300">User · mount · PID · network · IPC</text><text x="448" y="379">Kernel support and host provisioning must be verified</text></g><text x="40" y="453" font-size="16" fill="#795122">Bootstrap evidence is not a parent-acknowledged launch gate in the documented revision.</text></g></svg>
