<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Authenticated audit checkpoint and acknowledgement</title><desc id="desc">A local hash-chained ledger sends a session, sequence and head hash through the HTTPS transport to a durable service. A matching authenticated acknowledgement returns. The direct transport does not include the full audit record. Guest relay activation is separate unfinished work.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#176c64" stroke-width="1.5"/></marker></defs><rect width="1200" height="370" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="40" y="43" font-size="17" fill="#176c64" letter-spacing="2">EVIDENCE LEAVES THROUGH A DIFFERENT CHANNEL</text><g fill="#f3f6f2" stroke="#cad8d2"><rect x="40" y="90" width="282" height="112" rx="8"/><rect x="449" y="90" width="300" height="112" rx="8"/><rect x="877" y="90" width="282" height="112" rx="8"/></g><g fill="#18272c" font-size="23" text-anchor="middle" font-weight="600"><text x="181" y="129">Local audit ledger</text><text x="599" y="129">HTTPS transport</text><text x="1018" y="129">Anchor service</text></g><g fill="#52666b" font-size="16" text-anchor="middle"><text x="181" y="163">Actions + outcomes + chain</text><text x="181" y="185">Records stay access-controlled</text><text x="599" y="163">Session + sequence + head hash</text><text x="599" y="185">Authenticated bounded checkpoint</text><text x="1018" y="163">Durable bounded SQLite</text><text x="1018" y="185">Conflicts and retries checked</text></g><g fill="none" stroke="#176c64" stroke-width="2" marker-end="url(#a)"><path d="M324 142h117"/><path d="M752 142h116"/><path d="M1018 205v49H599v-45"/></g><text x="804" y="285" font-size="16" text-anchor="middle" fill="#176c64">Matching session, sequence, head hash and acknowledgement MAC</text><text x="40" y="331" font-size="16" fill="#795122">The direct HTTPS transport omits the full record. Guest relay activation requires a separate trusted bootstrap.</text></g></svg>
