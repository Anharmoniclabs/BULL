<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Optional MicroVM host-to-guest data route</title><desc id="desc">The Linux host supplies a kernel and three read-only virtio block images to a QEMU microVM accelerated by KVM. Guest root, workspace and trusted runtime remain distinct. Guest init mounts them and starts the supplied engine. No guest network device is attached; persistent protocol integration remains unfinished.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#176c64" stroke-width="1.5"/></marker></defs><rect width="1200" height="530" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="40" y="43" font-size="17" fill="#176c64" letter-spacing="2">LOCAL HOST ASSETS → READ-ONLY VIRTIO BLOCK → GUEST</text><rect x="40" y="73" width="1120" height="78" rx="8" fill="#18272c"/><text x="63" y="107" fill="#fff" font-size="23" font-weight="600">Linux x86-64 host + /dev/kvm</text><text x="63" y="133" fill="#b8ceca" font-size="16">QEMU microvm · hardware acceleration · minimal devices · no guest NIC · no monitor</text><g fill="#f3f6f2" stroke="#cad8d2"><rect x="40" y="182" width="345" height="110" rx="8"/><rect x="426" y="182" width="347" height="110" rx="8"/><rect x="814" y="182" width="346" height="110" rx="8"/></g><g fill="#18272c" font-size="23" font-weight="600" text-anchor="middle"><text x="212" y="218">Root filesystem</text><text x="600" y="218">Admitted workspace</text><text x="987" y="218">Trusted runtime</text></g><g fill="#52666b" font-size="17" text-anchor="middle"><text x="212" y="249">/dev/vda → /</text><text x="212" y="276">Read-only root + local kernel</text><text x="600" y="249">/dev/vdb → /workspace</text><text x="600" y="276">ro · noload · nosuid · nodev · noexec</text><text x="987" y="249">/dev/vdc → /bull_runtime</text><text x="987" y="276">ro · noload · nosuid · nodev</text></g><g fill="none" stroke="#176c64" stroke-width="2" marker-end="url(#a)"><path d="M212 294v57"/><path d="M600 294v57"/><path d="M987 294v57"/></g><rect x="40" y="360" width="1120" height="104" rx="8" fill="#edf2ed" stroke="#cad8d2"/><text x="63" y="397" fill="#18272c" font-size="23" font-weight="600">Guest kernel → /sbin/bull-init → supplied /bull_runtime/... engine</text><text x="63" y="435" fill="#52666b" font-size="18">Private /run and /tmp · explicit engine validation · development 9P is a separate opt-in route</text><text x="40" y="502" fill="#795122" font-size="16">Launcher implemented. Persistent session protocol, trusted guest relay and real-KVM release proof remain unfinished.</text></g></svg>
