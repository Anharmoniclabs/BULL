version: 1

network_policies:
  docs:
    name: docs
    endpoints:
      - host: host.openshell.internal
        port: 40959
        protocol: rest
        allowed_ips: ["172.17.0.1/32"]
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
    binaries:
      - path: /usr/bin/curl
  news:
    name: news
    endpoints:
      - host: host.openshell.internal
        port: 46731
        protocol: rest
        allowed_ips: ["172.17.0.1/32"]
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: "/**"
    binaries:
      - path: /usr/bin/curl
  api:
    name: api
    endpoints:
      - host: host.openshell.internal
        port: 35911
        protocol: rest
        allowed_ips: ["172.17.0.1/32"]
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/v1/**"
    binaries:
      - path: /usr/bin/curl
