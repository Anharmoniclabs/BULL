[project]
name = "bulldog-ai-firewall"
version = "0.2.0rc1"
description = "Local execution firewall and provenance-aware policy harness for AI agents"
requires-python = ">=3.11"
authors = [{name = "Anharmoniclabs"}]
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
hardware = ["cryptography>=43,<51"]
test = ["pytest>=8,<10", "cryptography>=43,<51", "build>=1,<2"]

[project.urls]
Source = "https://github.com/Anharmoniclabs/BULL"
Issues = "https://github.com/Anharmoniclabs/BULL/issues"
Security = "https://github.com/Anharmoniclabs/BULL/security/policy"

[project.scripts]
bull = "bulldog.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Explicit src-layout packaging. Do not rely on pytest's pythonpath setting or
# setuptools auto-discovery: a normal `pip install -e .` / wheel install must
# make `import bulldog` work in the interpreter that performed the install.
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["bulldog*"]

[tool.setuptools.package-data]
bulldog = ["_namespace_launcher.sh", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
