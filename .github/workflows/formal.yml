name: BULL formal invariants

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned TLA+ tools
        run: |
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" \
            | sha256sum --check --strict

      - name: Parse TLA+ specification
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/tla/BullRuntime.tla

      - name: Model-check BULL runtime invariants
        run: |
          # BullRuntime contains intentional terminal states such as review,
          # blocked, and completed execution/broker states. TLC's -deadlock
          # flag disables deadlock-as-error while still checking every
          # configured invariant across the reachable state graph.
          timeout 180s java -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock \
            -workers 1 \
            -config formal/tla/BullRuntime.cfg \
            formal/tla/BullRuntime.tla

      - name: Check session and audit design abstraction
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY formal/tla/BullSessionAudit.tla
          timeout 180s java -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock -workers 1 \
            -config formal/tla/BullSessionAudit.cfg formal/tla/BullSessionAudit.tla

      - name: Check one-use approval abstraction (not a hardware certification)
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY formal/tla/BullApproval.tla
          timeout 180s java -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock -workers 1 -config formal/tla/BullApproval.cfg formal/tla/BullApproval.tla
