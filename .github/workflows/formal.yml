name: BULL formal invariants

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fL \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o .tools/tla2tools-1.7.4.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  .tools/tla2tools-1.7.4.jar" \
            | sha256sum -c -

      - name: Parse TLA+ specification
        run: |
          java -cp .tools/tla2tools-1.7.4.jar tla2sany.SANY \
            formal/tla/BullRuntime.tla

      - name: Model-check BULL invariants
        working-directory: formal/tla
        run: |
          # BullRuntime intentionally has terminal blocked/review/executed states.
          # -deadlock disables TLC's deadlock error while all configured
          # invariants remain active and are still exhaustively checked.
          java -cp ../../.tools/tla2tools-1.7.4.jar tlc2.TLC \
            -deadlock \
            -config BullRuntime.cfg \
            BullRuntime.tla
