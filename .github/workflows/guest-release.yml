name: Build a draft BULL guest release with source materials

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New release tag, for example guest-2026.09.22"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install guest build dependencies
        run: |
          set -euo pipefail
          # Buildroot's downloads, extracted trees and compiler outputs need
          # more room than the base runner provides.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential binutils make bash patch gzip bzip2 \
            perl tar cpio unzip rsync file bc wget git curl xz-utils flex bison \
            libssl-dev libelf-dev pkg-config qemu-system-x86 e2fsprogs openssl \
            clamav clamav-freshclam
      - name: Install pinned CycloneDX Buildroot generator
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/cdx-tools"
          "$RUNNER_TEMP/cdx-tools/bin/python" -m pip install --disable-pip-version-check \
            "CycloneDX-Buildroot==2.0.0"
          "$RUNNER_TEMP/cdx-tools/bin/python" -m pip freeze \
            > "$RUNNER_TEMP/cyclonedx-toolchain.txt"
      - name: Configure and fetch pinned sources
        run: |
          set -euo pipefail
          python3 microvm/guest/build_public.py prepare \
            --output "$RUNNER_TEMP/bull-guest" --fetch
      - name: Download and verify official ClamAV databases
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/bull-database"
          bash tools/fetch_guest_databases.sh "$db"
          python3 microvm/guest/build_public.py databases \
            --output "$RUNNER_TEMP/bull-guest" --database-dir "$db"
      - name: Compile guest and firmware
        run: |
          set -euo pipefail
          python3 microvm/guest/build_public.py build \
            --output "$RUNNER_TEMP/bull-guest" --jobs 2 2>&1 | tee "$RUNNER_TEMP/bull-build.log"
      - name: Collect corresponding sources and license materials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, tarfile
          from pathlib import Path
          guest = Path(os.environ['RUNNER_TEMP']) / 'bull-guest'
          record = json.loads((guest / 'build.json').read_text())
          def check_config():
              for name, key in (('output/.config', 'resolved_config_sha256'),
                                ('output/build/linux-7.1.13/.config', 'resolved_kernel_config_sha256')):
                  if hashlib.sha256((guest / name).read_bytes()).hexdigest() != record[key]:
                      raise RuntimeError('resolved build configuration changed: ' + name)
          check_config()
          buildroot = Path(record['sources']['buildroot']['path'])
          subprocess.run(['make', '-C', str(buildroot), 'O=' + str(guest / 'output'), 'legal-info'], check=True)
          check_config()
          legal = guest / 'output/legal-info'
          for name in ('manifest.csv', 'licenses', 'sources'):
              if not (legal / name).exists():
                  raise RuntimeError('missing legal-info material: ' + name)
          materials = guest / 'source-materials'
          materials.mkdir()
          shutil.copytree(legal, materials / 'legal-info')
          for name, entry in record['sources'].items():
              subprocess.run(['git', '-C', entry['path'], 'archive', '--format=tar.gz',
                              '--prefix=' + name + '/', '-o', str(materials / (name + '.tar.gz')),
                              entry['commit']], check=True)
          subprocess.run(['git', 'archive', '--format=tar.gz', '--prefix=BULL/',
                          '-o', str(materials / 'BULL.tar.gz'), 'HEAD'], check=True)
          shutil.copytree(guest / 'inputs', materials / 'inputs', symlinks=True)
          shutil.copyfile(guest / 'output/.config', materials / 'buildroot.config')
          shutil.copyfile(guest / 'output/build/linux-7.1.13/.config', materials / 'linux.config')
          shutil.copyfile(guest / 'build.json', materials / 'build.json')
          with tarfile.open(guest / 'source-materials.tar.gz', 'w:gz', dereference=False) as archive:
              archive.add(materials, arcname='source-materials')
          PY
      - name: Generate and validate CycloneDX guest SBOM
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          guest="$RUNNER_TEMP/bull-guest"
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          "$RUNNER_TEMP/cdx-tools/bin/cyclonedx-buildroot" \
            -i "$guest/output/legal-info/manifest.csv" \
            -o "$release/bull-guest.cdx.json" \
            -n "BULL guest" \
            -v "$RELEASE_TAG" \
            -m "Anharmoniclabs" \
            -s "Anharmoniclabs" \
            -a "BULL guest release workflow"
          test -s "$release/bull-guest.cdx.json"
          cp "$RUNNER_TEMP/cyclonedx-toolchain.txt" "$release/cyclonedx-toolchain.txt"
          PYTHONPATH=src python3 - <<'PY'
          from bulldog.release_evidence import inspect_cyclonedx
          import os
          from pathlib import Path
          report = inspect_cyclonedx(Path(os.environ["RUNNER_TEMP"]) / "release/bull-guest.cdx.json")
          assert report["valid"] is True
          print(report)
          PY
      - name: Verify and package immutable release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          guest="$RUNNER_TEMP/bull-guest"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$guest/build.json")" = BUILT_NOT_BOOT_TESTED
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          guest = Path(os.environ["RUNNER_TEMP"]) / "bull-guest"
          assets = json.loads((guest / "assets.json").read_text())
          assert set(assets) == {"kernel", "rootfs", "firmware"}
          for entry in assets.values():
              path = Path(entry["path"])
              assert path.is_file() and not path.is_symlink() and path.stat().st_size > 0
          PY
          mkdir -p "$RUNNER_TEMP/release"
          cp "$guest/artifacts/"* "$RUNNER_TEMP/release/"
          cp "$guest/assets.json" "$guest/build.json" "$RUNNER_TEMP/release/"
          # Split only the archive bytes if needed to stay below GitHub's asset limit.
          split -b 1900M -d "$guest/source-materials.tar.gz" "$RUNNER_TEMP/release/source-materials.tar.gz.part-"
          printf '%s\n' "BULL guest image $RELEASE_TAG" > "$RUNNER_TEMP/release/RELEASE_SCOPE.txt"
          cat >> "$RUNNER_TEMP/release/RELEASE_SCOPE.txt" <<'EOF'
          This release was built from the pinned public recipe and its official ClamAV
          database signatures. It includes a CycloneDX guest SBOM plus signed GitHub
          Artifact Attestations for SLSA provenance and the rootfs SBOM. The workflow
          verifies those attestations before release creation, then SHA256SUMS covers
          every release file. BUILT_NOT_BOOT_TESTED means
          the image was compiled and hash-checked; it is not proof of VM boot, physical
          approval, independent review, or universal security certification. Run the five
          KVM cases from docs/CODESPACES_VM_AND_KEY_CHECKS.md after downloading it.
          This is a draft pending review of source materials and upstream notices.
          Reassemble source materials with:
            cat source-materials.tar.gz.part-* > source-materials.tar.gz
          Inspect legal-info manifests, license files, sources and warnings. Generation
          alone is not a completeness review. Verify downloaded runtime artifacts with
          "gh attestation verify ARTIFACT -R Anharmoniclabs/BULL" in addition to SHA256SUMS.
          Follow docs/DISTRIBUTION.md before publishing.
          EOF
          PYTHONPATH=src python3 -m bulldog.release_evidence checksums \
            --directory "$RUNNER_TEMP/release" \
            --output SUBJECT_SHA256SUMS \
            --exclude "provenance.sigstore.json" \
            --exclude "guest-sbom.sigstore.json" \
            --exclude "attestation-verification.json" \
            --exclude "provenance-verification.json" \
            --exclude "guest-sbom-verification.json" \
            --exclude "SHA256SUMS"
      - name: Resolve copied rootfs subject
        id: rootfs
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          rootfs="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          guest = Path(os.environ["RUNNER_TEMP"]) / "bull-guest"
          assets = json.loads((guest / "assets.json").read_text())
          print(Path(assets["rootfs"]["path"]).name)
          PY
          )"
          test -f "$release/$rootfs"
          echo "path=$release/$rootfs" >> "$GITHUB_OUTPUT"

      - name: Generate signed SLSA provenance attestation
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ runner.temp }}/release/SUBJECT_SHA256SUMS

      - name: Preserve provenance Sigstore bundle
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "$RUNNER_TEMP/release/provenance.sigstore.json"

      - name: Generate signed CycloneDX SBOM attestation for rootfs
        id: guest-sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.rootfs.outputs.path }}
          sbom-path: ${{ runner.temp }}/release/bull-guest.cdx.json

      - name: Preserve SBOM Sigstore bundle
        run: |
          set -euo pipefail
          cp "${{ steps.guest-sbom.outputs.bundle-path }}" \
            "$RUNNER_TEMP/release/guest-sbom.sigstore.json"

      - name: Verify signed attestations before release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          gh attestation verify "${{ steps.rootfs.outputs.path }}" \
            -R "$GITHUB_REPOSITORY" --format json \
            > "$release/provenance-verification.json"
          predicate="$(PYTHONPATH=src python3 -m bulldog.release_evidence predicate-type \
            --bundle "$release/guest-sbom.sigstore.json")"
          gh attestation verify "${{ steps.rootfs.outputs.path }}" \
            -R "$GITHUB_REPOSITORY" --predicate-type "$predicate" --format json \
            > "$release/guest-sbom-verification.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "release"
          for name in ("provenance-verification.json", "guest-sbom-verification.json"):
              value = json.loads((root / name).read_text())
              if not value:
                  raise SystemExit("empty GitHub attestation verification result: " + name)
          (root / "attestation-verification.json").write_text(json.dumps({
              "format": "bull-attestation-verification-v1",
              "provenance_verified": True,
              "sbom_verified": True,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
          }, sort_keys=True, indent=2) + "\n")
          PY
          PYTHONPATH=src python3 -m bulldog.release_evidence checksums \
            --directory "$release" --output SHA256SUMS
          PYTHONPATH=src python3 -m bulldog.release_evidence verify \
            --directory "$release" --checksum SHA256SUMS
          PYTHONPATH=src python3 -m bulldog.release_evidence inspect \
            --directory "$release"

      - name: Create the draft versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace immutable guest assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft --prerelease \
            --title "BULL guest image $RELEASE_TAG" \
            --notes "Draft for source/license review and guest qualification. Verify SHA256SUMS and GitHub Artifact Attestations before use. Reassemble source-materials.tar.gz.part-* before extracting. Read RELEASE_SCOPE.txt and docs/DISTRIBUTION.md. The image is BUILT_NOT_BOOT_TESTED."
