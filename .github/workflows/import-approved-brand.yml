name: Import exact approved BULL artwork (one-time branch task)

on:
  push:
    branches: [branding/approved-bulldog-b-20260919]
    paths: [.github/workflows/import-approved-brand.yml, tools/build_brand_assets.py]

permissions:
  contents: read

jobs:
  import-approved-art:
    if: github.repository == 'Anharmoniclabs/BULL' && github.ref == 'refs/heads/branding/approved-bulldog-b-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: branding/approved-bulldog-b-20260919
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Download only the owner-approved public image and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 60 --retry 2 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3BN6e9xn2X4STcw4FAYAt0XmfjE/98c95928-2090-4380-9216-28ec7e61c228.png' \
            --output /tmp/bull-approved.png
          echo '79a75d93e09f2b0a460c7ae3feb854c601803adc922bf9a54346955bfd7d803a  /tmp/bull-approved.png' | sha256sum --check --strict
      - name: Build the approved logo variants
        run: |
          python -m pip install Pillow==11.3.0 vtracer==0.6.12
          python tools/build_brand_assets.py --source /tmp/bull-approved.png
      - name: Validate assets and existing publication without touching runtime
        run: |
          git add -- site/assets/brand
          git diff --cached --check
          python -m unittest discover -s tests -p test_approved_brand.py -v
          python -m unittest discover -s tests -p test_brand_site.py -v
          python -m unittest discover -s tests -p test_repository_artifacts.py -v
      - name: Commit generated public branding only to the working branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'branding/approved-bulldog-b-20260919'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import approved B-shaped bulldog source and self-contained logo pack'
          git push origin HEAD:refs/heads/branding/approved-bulldog-b-20260919
          git rev-parse HEAD
