name: BULL security regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Enable user namespaces for sandbox integration tests
        shell: bash
        run: |
          set -euo pipefail
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount --pid --fork --net --ipc true
      - name: Install signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
      - name: Compile trusted runtime
        run: python -m compileall -q src/bulldog
      - name: Local-host red-team boundary
        run: python -m pytest -q tests/redteam_local_host
      - name: Full regression suite
        run: python -m pytest -q --junitxml=/tmp/bull-regression.xml
      - name: Deployment runner reports missing deployment inputs honestly
        shell: bash
        run: |
          set -euo pipefail
          code=0
          python tools/deployment_check.py --output /tmp/bull-deployment-check || code=$?
          test "$code" -eq 1
          python - <<'PY'
          import json
          r = json.load(open('/tmp/bull-deployment-check/report.json'))
          assert r['certified'] is False
          assert r['automated_checks_passed'] is False
          for name in ('strict_host', 'approval_protocol', 'live_local_tls', 'unchanged_clean_source'):
              assert r['gates'][name]['status'] == 'PASS', (name, r['gates'][name])
          for name in ('source', 'production_configuration', 'guest_assets', 'current_candidate_kvm', 'external_collector_host', 'external_collector_with_guest', 'hardware_approval_protocol'):
              assert r['gates'][name]['status'] == 'BLOCKED', (name, r['gates'][name])
          assert r['manual_gates']['independent_review'] == 'REQUIRES_INDEPENDENT_REVIEW'
          PY
      - name: Installed-package import smoke test
        run: |
          cd /tmp
          python -I -c "import bulldog; import bulldog.multiagent; print('installed import OK:', bulldog.__file__)"
      - name: Build source distribution and install its wheel in a fresh environment
        run: |
          python -m pip install 'setuptools>=77' wheel
          python tools/check_package.py --output "$RUNNER_TEMP/bull-package"
      - name: Portable deployment ignores unrelated ambient authority
        shell: bash
        env:
          BULL_REMOTE_AUDIT_ANCHOR_URL: https://must-not-contact.invalid/v1/checkpoints
          BULL_APPROVAL_KEY: /not-an-enrolled-credential
        run: |
          set -euo pipefail
          python tools/deployment_setup.py init \
            --state "$RUNNER_TEMP/bull-independent" --project-root "$GITHUB_WORKSPACE"
          code=0
          python tools/deployment_check.py --deployment "$RUNNER_TEMP/bull-independent" \
            --output "$RUNNER_TEMP/bull-independent-report" || code=$?
          test "$code" -eq 1
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'bull-independent-report/report.json').read_text())
          assert r['gates']['deployment_configuration']['status'] == 'PASS'
          for name in ('external_collector_host', 'hardware_approval_protocol', 'cgroup_delegation'):
              assert r['gates'][name]['status'] == 'BLOCKED', r['gates'][name]
          for name in ('strict_host', 'approval_protocol', 'live_local_tls', 'unchanged_clean_source'):
              assert r['gates'][name]['status'] == 'PASS', r['gates'][name]
          assert r['certified'] is False
          PY
      - name: Real administrator delegation and unprivileged child placement
        shell: bash
        run: |
          set -euo pipefail
          BULL_RUNNER_PYTHON="$(command -v python)"
          sudo /usr/bin/python3 -I tools/host_setup.py \
            --user "$(id -un)" --enable-parent-controllers --enter-shell <<COMMANDS
          set -euo pipefail
          "$BULL_RUNNER_PYTHON" tools/deployment_setup.py init \
            --state "$RUNNER_TEMP/bull-host-delegation" --project-root "$GITHUB_WORKSPACE" \
            --cgroup-parent "\$BULL_CGROUP_PARENT"
          "$BULL_RUNNER_PYTHON" tools/deployment_setup.py cgroup-check \
            --state "$RUNNER_TEMP/bull-host-delegation"
          exit
          COMMANDS
