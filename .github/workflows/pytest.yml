name: BULL security regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Installed-package import smoke test
        run: |
          cd /tmp
          python -I -c "import bulldog; import bulldog.multiagent; print('installed import OK:', bulldog.__file__)"
      - name: Compile trusted runtime
        run: python -m compileall -q src/bulldog
      - name: Local-host red-team boundary
        run: python -m pytest -q tests/redteam_local_host
      - name: Full regression suite
        run: python -m pytest -q
