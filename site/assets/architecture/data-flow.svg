<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">BULL control and file-data paths</title><desc id="desc">The agent proposal and separately trusted host context feed canonicalization, command binding and policy. The admitted project is copied, scanned and re-hashed before execution. Bounded results return to the trusted caller.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#176c64" stroke-width="1.5"/></marker></defs><rect width="1200" height="510" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="40" y="44" fill="#176c64" font-size="17" letter-spacing="2">CONTROL AND FILE DATA MEET AT EXECUTION</text><g fill="#f3f6f2" stroke="#cad8d2"><rect x="40" y="80" width="228" height="80" rx="8"/><rect x="40" y="190" width="228" height="80" rx="8"/><rect x="338" y="130" width="244" height="92" rx="8"/><rect x="652" y="130" width="236" height="92" rx="8"/><rect x="958" y="130" width="202" height="92" rx="8"/><rect x="40" y="350" width="228" height="88" rx="8"/><rect x="338" y="350" width="244" height="88" rx="8"/><rect x="652" y="350" width="236" height="88" rx="8"/><rect x="958" y="350" width="202" height="88" rx="8"/></g><g fill="#18272c" font-size="21" font-weight="600" text-anchor="middle"><text x="154" y="114">Agent proposal</text><text x="154" y="224">Trusted host</text><text x="460" y="167">Canonicalize + bind</text><text x="770" y="167">Policy + history</text><text x="1059" y="167">Namespace run</text><text x="154" y="387">Selected project</text><text x="460" y="387">Private snapshot</text><text x="770" y="387">Scan + re-hash</text><text x="1059" y="387">Bounded result</text></g><g fill="#52666b" font-size="15" text-anchor="middle"><text x="154" y="141">Operation + resource</text><text x="154" y="251">Identity + origin + grants</text><text x="460" y="196">Actual capability + exact argv</text><text x="770" y="196">Grants, ceilings, lineage</text><text x="1059" y="196">Read-only admitted bytes</text><text x="154" y="416">Not the entire host</text><text x="460" y="416">Validate + copy + manifest</text><text x="770" y="416">Required before execution</text><text x="1059" y="416">Return code + streams</text></g><g fill="none" stroke="#176c64" stroke-width="2" marker-end="url(#a)"><path d="M270 120h28v40h35"/><path d="M270 230h28v-40h35"/><path d="M584 175h62"/><path d="M890 175h62"/><path d="M270 392h62"/><path d="M584 392h62"/><path d="M770 349v-66h288v-55"/><path d="M1060 225v118"/></g><text x="770" y="255" fill="#795122" font-size="15" text-anchor="middle">Deny / review stops the run</text><text x="904" y="312" fill="#52666b" font-size="14" text-anchor="middle">Admitted copy only</text><text x="40" y="481" fill="#52666b" font-size="16">Command authority and filesystem admission are separate checks. Cleanup removes the private snapshot.</text></g></svg>
