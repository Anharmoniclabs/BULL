<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">BULL: from information to controlled execution</title><desc id="desc">Play the narrated architecture film to follow proposals, host permissions, admitted files, Linux isolation, MicroVM infrastructure, audit and results.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#73b3a8" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="#18272c"/><path d="M0 0h12v675H0z" fill="#73b3a8"/><g font-family="system-ui, sans-serif"><text x="66" y="82" font-size="27" fill="#fff" font-weight="700">BULL</text><text x="164" y="80" fill="#a4bdbb" font-size="13" letter-spacing="2">BLOCKING UNAUTHORIZED LOGIC LOOPHOLES</text><text x="66" y="158" fill="#a4bdbb" font-size="16" letter-spacing="3">THE ARCHITECTURE EXPLAINED</text><text x="66" y="231" fill="#fff" font-size="55" font-weight="650">Information is not permission.</text><text x="66" y="284" fill="#becfcb" font-size="23">Follow the control path, the file data and the kernel boundary.</text><g fill="#23383c" stroke="#537771"><rect x="66" y="365" width="215" height="105" rx="8"/><rect x="350" y="365" width="215" height="105" rx="8"/><rect x="635" y="365" width="215" height="105" rx="8"/><rect x="920" y="365" width="215" height="105" rx="8"/></g><g fill="#fff" font-size="21" text-anchor="middle"><text x="173" y="408">Agent request</text><text x="457" y="408">Host permission</text><text x="742" y="408">Linux boundary</text><text x="1027" y="408">Bounded results</text></g><g fill="#a4bdbb" font-size="15" text-anchor="middle"><text x="173" y="440">Untrusted proposal</text><text x="457" y="440">Policy + command binding</text><text x="742" y="440">Admitted data + restrictions</text><text x="1027" y="440">Audit + cleanup</text></g><g stroke="#73b3a8" stroke-width="2" marker-end="url(#a)"><path d="M284 417h52"/><path d="M568 417h53"/><path d="M853 417h53"/></g><line x1="66" y1="524" x2="1135" y2="524" stroke="#395157"/><text x="66" y="575" fill="#fff" font-size="22">4:04 · Narrated animation · 11 chapters</text><text x="66" y="613" fill="#a4bdbb" font-size="16">Source-based explanation. Not a recording of a certified production VM.</text></g></svg>
