<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="779" viewBox="0 0 1200 779" role="img"><title>BULL red-team regression latency</title><desc>Mean end-to-end pytest latency; includes Python/pytest startup and fixture overhead.</desc><rect width="100%" height="100%" fill="#fff"/><text x="370" y="42" font-family="system-ui,sans-serif" font-size="28" font-weight="650" fill="#18272c">BULL red-team regression latency</text><text x="370" y="72" font-family="system-ui,sans-serif" font-size="15" fill="#52666b">Mean end-to-end pytest latency; includes Python/pytest startup and fixture overhead.</text><line x1="370" y1="98" x2="370" y2="709" stroke="#d6dfdb"/><line x1="547.5" y1="98" x2="547.5" y2="709" stroke="#d6dfdb"/><line x1="725" y1="98" x2="725" y2="709" stroke="#d6dfdb"/><line x1="902.5" y1="98" x2="902.5" y2="709" stroke="#d6dfdb"/><line x1="1080" y1="98" x2="1080" y2="709" stroke="#d6dfdb"/><text x="352" y="134" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Path traversal encodings</text><rect x="370" y="114" width="572.0672857142857" height="29" rx="3" fill="#176c64"/><text x="950.0672857142857" y="134" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">338 ms</text><text x="352" y="188" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Read authority → shell execution</text><rect x="370" y="168" width="619.4361190476191" height="29" rx="3" fill="#176c64"/><text x="997.4361190476191" y="188" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">366 ms</text><text x="352" y="242" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Authorized argv → force-push drift</text><rect x="370" y="222" width="537.7590714285715" height="29" rx="3" fill="#176c64"/><text x="915.7590714285715" y="242" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">318 ms</text><text x="352" y="296" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">External content → credential read</text><rect x="370" y="276" width="509.9676428571429" height="29" rx="3" fill="#176c64"/><text x="887.9676428571429" y="296" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">302 ms</text><text x="352" y="350" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">SANDBOX verdict → egress broker</text><rect x="370" y="330" width="494.6384047619048" height="29" rx="3" fill="#176c64"/><text x="872.6384047619048" y="350" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">293 ms</text><text x="352" y="404" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">SANDBOX verdict → secret broker</text><rect x="370" y="384" width="514.6502619047619" height="29" rx="3" fill="#176c64"/><text x="892.6502619047619" y="404" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">304 ms</text><text x="352" y="458" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Private/metadata SSRF targets</text><rect x="370" y="438" width="601.6844285714285" height="29" rx="3" fill="#176c64"/><text x="979.6844285714285" y="458" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">356 ms</text><text x="352" y="512" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Wrong Unix peer UID</text><rect x="370" y="492" width="608.7201904761905" height="29" rx="3" fill="#176c64"/><text x="986.7201904761905" y="512" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">360 ms</text><text x="352" y="566" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Prompt injection</text><rect x="370" y="546" width="594.3562142857144" height="29" rx="3" fill="#176c64"/><text x="972.3562142857144" y="566" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">352 ms</text><text x="352" y="620" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Forged policy verdict</text><rect x="370" y="600" width="621.4376428571428" height="29" rx="3" fill="#176c64"/><text x="999.4376428571428" y="620" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">368 ms</text><text x="352" y="674" text-anchor="end" font-family="system-ui,sans-serif" font-size="16" fill="#18272c">Approval-token replay</text><rect x="370" y="654" width="636.7009523809523" height="29" rx="3" fill="#176c64"/><text x="1014.7009523809523" y="674" font-family="ui-monospace,monospace" font-size="13" fill="#18272c">377 ms</text></svg>